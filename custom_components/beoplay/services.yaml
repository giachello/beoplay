beoplay_expand:
  name: "Expand Experience"
  description: "Add a device to the selected media player's current playback experience."
  fields:
    entity_id:
      name: "B&O Media player"
      description: "The beoplay media player whose playback experience to expand."
      required: true
      selector:
        entity:
          integration: beoplay
          domain: media_player
          multiple: true
    jid:
      name: "Listener JID"
      description: "The JID of the device to add to the playback experience."
      required: true
      example: "1234.1234567.12345678@products.bang-olufsen.com"
      selector:
        text:
beoplay_join_experience:
  name: "Join Experience"
  description: "Join an ongoing playback experience. E.g., the speaker starts playback of a CD already playing on another device."
  fields:
    entity_id:
      name: "B&O Media player"
      description: "A beoplay Entity ID."
      example: "media_player.my_beo_device"
beoplay_leave_experience:
  name: "Leave Experience"
  description: "Leave the current playback experience."
  fields:
    entity_id:
      name: "B&O Media player"
      description: "A beoplay Entity ID."
      example: "media_player.my_beo_device"
beoplay_add_media_to_queue:
  name: "Add to playback Queue"
  description: "Add media to the current playback queue. This is untested. Please report back if it works."
  fields:
    entity_id:
      name: "B&O Media player"
      description: "A beoplay Entity ID."
      example: "media_player.my_beo_device"
    url:
      name: "Media URL"
      description: "A URL to add to the playback queue. Must be reachable from the speaker."
      example: "http://192.168.1.1/DLNAfile.mp3"
beoplay_set_speaker_group:
  name: "Set Speaker Group"
  description: "Select a speaker group configured on the B&O TV."
  fields:
    entity_id:
      name: "B&O Media player"
      description: "A beoplay Entity ID."
      required: true
      selector:
        entity:
          integration: beoplay
          domain: media_player
          multiple: true
    id:
      name: "Speaker group"
      description: "The speaker group name, as configured on the TV and listed in the speaker_groups attribute."
      required: true
      example: "Living Room"
      selector:
        text:
beoplay_set_stand_position:
  name: "Set Stand Position"
  description: "Set the B&O TV stand position."
  fields:
    entity_id:
      name: "B&O Media player"
      description: "A beoplay Entity ID."
      example: "media_player.my_beo_device"
    id:
      name: "Stand position"
      description: "The stand position name, as configured on the TV."
      example: "Start-up"
